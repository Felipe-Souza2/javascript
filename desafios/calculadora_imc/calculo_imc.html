<!DOCTYPE html>
<html lang="PT-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora IMC</title>
  <style>
    * {
      margin: auto;
    }
     table {
     border-collapse: collapse;
     width: 300px;
    }
    
    td {
      border: 1px solid black;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <label for="peso">Peso:</label>
  <input type="number" name="peso" id="peso" required placeholder="999"><br>
  <br>
  <label for="altura">Altura:</label>
  <input type="number" name="altura" id="altura" required placeholder="1.50"><br>
  <br>
  <button onclick="calcular()">Calcular</button>
  <button onclick="limpar()">Limpar</button>
  <br>
  <br>
  <div id="resultado"></div>
  <br>
  <br>

  <table>
    <th>faixa</th>
    <th>IMC</th>
    <tr>
      <td>Abaixo do peso</td>
      <td>Menor que 18.5</td>
    </tr>
    <tr>
      <td>Peso normal</td>
      <td>de 18.5 ate 24.5</td>
    </tr>
    <tr>
      <td>Sobrepeso</td>
      <td>de 25 ate 29.9</td>
    </tr>
    <tr>
      <td>Obesidade</td>
      <td>30 ou mais</td>
    </tr>
  </table>

  <script src="script.js"></script>
</body>
</html>
